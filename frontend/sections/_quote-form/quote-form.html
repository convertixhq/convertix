<section class="cld-quote-section" id="quote">
  <div class="cld-container">

    <div class="cld-quote-panel">

      <div class="cld-quote-copy">
        <p class="cld-eyebrow">Request a quote</p>

        <h2>
          Turn visitors into clear project enquiries.
        </h2>

        <p>
          This reusable quote form gives every Claudine service template a clean
          way to capture leads without overwhelming the visitor.
        </p>
      </div>

      <form class="cld-quote-form">
        <div class="cld-form-row">
          <div class="cld-field">
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Your name" />
          </div>

          <div class="cld-field">
            <label for="phone">Phone</label>
            <input id="phone" type="tel" placeholder="Your phone number" />
          </div>
        </div>

        <div class="cld-form-row">
          <div class="cld-field">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="you@example.com" />
          </div>

          <div class="cld-field">
            <label for="budget">Budget</label>
            <select id="budget">
              <option>Not sure yet</option>
              <option>Under £1,000</option>
              <option>£1,000 - £5,000</option>
              <option>£5,000+</option>
            </select>
          </div>
        </div>

        <div class="cld-field">
          <label for="message">Project details</label>
          <textarea id="message" placeholder="Tell us what you need..."></textarea>
        </div>

        <button class="cld-btn cld-btn--primary" type="submit">
          Send enquiry
        </button>
      </form>

    </div>

  </div>
</section>
