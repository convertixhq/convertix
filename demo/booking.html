<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Appointment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      background: rgba(255,255,255,0.05);
      padding: 30px;
      border-radius: 20px;
      width: 350px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      color: #000;
    }

    .note {
      font-size: 12px;
      margin-top: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Book Clinic Visit (£50 deposit)</h1>
    <p>Select your appointment and secure your slot.</p>

    <input type="text" placeholder="Full name" required>
    <input type="tel" placeholder="Phone number" required>
    <input type="date" required>

    <button type="button" id="booking-btn">Book appointment</button>

    <div class="note">
      Deposit is deducted from your treatment. Payments go directly to the clinic.
    </div>
  </div>

  <script>
    function confirmBooking() {
      alert("Booking confirmed → next: payment integration (Stripe later)");
    }
  </script>

</body>
</html>
