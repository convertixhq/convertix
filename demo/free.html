<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Consultation — Convertix</title>

  <link rel="stylesheet" href="../frontend/css/style.css" />
</head>

<body>

  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>
  <div class="bg-glow glow-3"></div>

  <nav class="top-nav">
    <div class="nav-logo">CONVERT<span>IX</span></div>

    <div class="nav-links">
      <a href="../index.html">Home</a>
      <a href="clinic.html">Demo</a>
      <a href="priority.html">Priority</a>
      <a href="booking.html">Booking</a>
    </div>
  </nav>

  <main class="page demo-page">

    <section class="demo-card form-card">

      <div class="mini-label">
        FREE CONSULTATION
      </div>

      <h1>Request your free callback</h1>

      <p>
        Leave your details and the clinic team will contact you within 24 hours.
      </p>

      <form class="lead-form" action="success-free.html">

        <label>
          Full name
          <input type="text" required />
        </label>

        <label>
          Phone number
          <input type="tel" required />
        </label>

        <label>
          Email address
          <input type="email" required />
        </label>

        <label>
          What treatment are you interested in?

          <select required>
            <option value="">Choose an option</option>
            <option>Hair restoration</option>
            <option>Dental consultation</option>
            <option>Skin treatment</option>
            <option>Weight loss consultation</option>
            <option>Other</option>
          </select>
        </label>

        <button type="submit" class="btn primary form-submit">
          Request free consultation
        </button>

      </form>

      <p class="demo-note">
        No payment required. Your details go directly to the clinic.
      </p>

    </section>

  </main>

  <script src="../frontend/js/app.js"></script>

</body>
</html>
