<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Free Consultation — Claudine</title>

  <link rel="stylesheet" href="../frontend/css/style.css" />
</head>

<body>

  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>
  <div class="bg-glow glow-3"></div>

  <div id="navbar-container"></div>
  
  <main class="page demo-page">

    <section class="demo-card form-card">

      <div class="mini-label">
        FREE CONSULTATION
      </div>

      <h1>
        Request your free callback
      </h1>

      <p>
        Complete the short form below and a clinic specialist will contact you within 24 hours to discuss your consultation and treatment options.
      </p>

      <form
        class="lead-form"
        action="https://formspree.io/f/mnjwwran"
        method="POST"
      >

        <label>
          Full name

          <input
            type="text"
            name="full_name"
            placeholder="John Smith"
            required
          />
        </label>

        <label>
          Phone number

          <input
            type="tel"
            name="phone"
            placeholder="+44 7700 900000"
            required
          />
        </label>

        <label>
          Email address

          <input
            type="email"
            name="email"
            placeholder="john@email.com"
            required
          />
        </label>

        <label>
          Treatment interest

          <select name="treatment" required>

            <option value="">
              Choose an option
            </option>

            <option>
              Hair restoration
            </option>

            <option>
              Dental consultation
            </option>

            <option>
              Skin treatment
            </option>

            <option>
              Weight loss consultation
            </option>

            <option>
              Other
            </option>

          </select>

        </label>

        <input
          type="hidden"
          name="_redirect"
          value="https://convertixhq.github.io/claudine/demo/success-free.html"
        />

        <input
          type="hidden"
          name="form_type"
          value="Free Consultation"
        />

        <button
          type="submit"
          class="btn primary form-submit"
        >
          Request free consultation
        </button>

      </form>

      <p class="demo-note">
        No payment required. All enquiries are sent directly to the clinic.
      </p>

    </section>

  </main>

  <script src="../frontend/js/app.js"></script>

</body>

</html>
