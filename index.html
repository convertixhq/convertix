<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convertix — Conversion Systems For Clinics</title>
  <link rel="stylesheet" href="frontend/css/style.css" />
</head>

<body>
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>
  <div class="bg-glow glow-3"></div>
  <div id="navbar-container"></div>
  <main class="page">

  <div id="hero-container"></div>  
  <div id="trust-container"></div>  
  <div id="features-container"></div>
  <div id="pricing-container"></div> 
  <div id="footer-container"></div> 
  </main>

<script>
function initNavbar() {
  const menuToggle = document.querySelector(".menu-toggle");
  const navLinks = document.querySelector(".nav-links");
  const nav = document.querySelector(".top-nav");

  if (menuToggle && navLinks) {
    menuToggle.addEventListener("click", () => {
      navLinks.classList.toggle("active");
      menuToggle.classList.toggle("open");
    });

    document.querySelectorAll(".nav-links a").forEach(link => {
      link.addEventListener("click", () => {
        navLinks.classList.remove("active");
        menuToggle.classList.remove("open");
      });
    });
  }

  if (nav) {
    window.addEventListener("scroll", () => {
      if (window.scrollY > 40) {
        nav.classList.add("nav-scrolled");
      } else {
        nav.classList.remove("nav-scrolled");
      }
    });
  }
}

fetch("frontend/components/navbar/navbar.html")
  .then(response => response.text())
  .then(data => {
    document.getElementById("navbar-container").innerHTML = data;
    initNavbar();
  });

fetch("frontend/components/hero/hero.html")
  .then(response => response.text())
  .then(data => {
    document.getElementById("hero-container").innerHTML = data;
  });

fetch("frontend/components/trust/trust.html")
  .then(response => response.text())
  .then(data => {
    document.getElementById("trust-container").innerHTML = data;
  });

fetch("frontend/components/features/features.html")
  .then(response => response.text())
  .then(data => {
    document.getElementById("features-container").innerHTML = data;
  });

fetch("frontend/components/pricing/pricing.html")
  .then(response => response.text())
  .then(data => {
    document.getElementById("pricing-container").innerHTML = data;
  });

fetch("frontend/components/footer/footer.html")
  .then(response => response.text())
  .then(data => {
    document.getElementById("footer-container").innerHTML = data;
  });
</script>
</body>
</html>
